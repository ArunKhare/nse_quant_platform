[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-quant-platform"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = [
  "kiteconnect>=5.0.1",
  "duckdb>=1.1.0",
  "polars>=1.8.0",
  "pandas>=2.2.0",
  "numpy>=2.0.0",
  "scipy>=1.14.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "PyYAML>=6.0.2",
  "plotly>=5.24.0",
  "dash>=2.18.0",
  "pandas-ta-classic>=0.3.14",
  "vectorbt>=0.26.0",
  "quantstats>=0.0.62",
  "apscheduler>=3.10.4",
  "structlog>=24.4.0",
  "tenacity>=9.0.0",
  "python-dotenv>=1.0.1",
  "pyotp>=2.9.0",
  "requests>=2.32.0",
  "pyarrow>=26.0.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13.0",
  "pre-commit>=4.0.0",
  "pylint>=3.0.0",
  "pylint-pydantic>=0.4.0",
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pylint>=3.0.0",
    "pylint-pydantic>=0.4.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
explicit_package_bases = true

files = [
  "src/",
  "scripts/",
  "tests/",
  "config/"
]

[tool.pylint.main]
load-plugins = ["pylint_pydantic"]
