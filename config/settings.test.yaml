# Global non-secret platform configuration.
# Secrets remain in .env. Environment variables override YAML.

safety:
  dry_run: false
  trading_enabled: false
  paper_trading: true
  allowed_strategies: [iron_condor_monitor]

universe:
  underlying: NIFTY
  strikes_per_side: 10

runtime:
  stale_seconds: 300
  loop_interval_seconds: 15
  market_closed_wait_seconds: 60
  enforce_market_hours: true
  allow_out_of_hours_testing: true

storage:
  db_path: data/nse_quant.duckdb
  parquet_dir: data/parquet
  dashboard_host: 127.0.0.1
  dashboard_port: 8050
  db_memory_limit: 512MB
  db_threads: 2

analytics:
  risk_free_rate: 0.07
  rv_window: 20
  iv_history_limit: 250
  min_iv_rank: 0
  min_iv_rv_spread: 0.02
  max_expected_move_buffer: 1.15
  min_iv_history_observations: 30
  allow_iv_rank_cold_start: true
  expiries_per_snapshot: 2

risk:
  max_lots_per_order: 2
  max_open_positions: 3
  max_notional_exposure: 2000000
  max_daily_loss: 25000
  max_portfolio_delta: 100
  max_portfolio_vega: 5000
  max_portfolio_gamma: 0.01
  max_spread_pct: 0.03
  min_oi: 50000
  min_volume: 500

exits:
  theta_decay_target_pct: 50
  iv_collapse_pct: 20
  data_quality_max_age_seconds: 30
  expected_move_violation_buffer: 1.25

paper_execution:
  fill_slippage_pct: 0
  allow_partial_fills: true

notifier:
  enabled: true
  telegram:
    uri: "https://api.telegram.org/bot{token}/sendMessage"
    enabled: true
    message_length_limit: 4096

market_data:
  default_symbol: NIFTY
  index_symbols:
    - NIFTY
    - BANKNIFTY
    - FINNIFTY
    - MIDCPNIFTY
  index_instrument_symbols:
    NIFTY: "NIFTY 50"
    BANKNIFTY: "NIFTY BANK"
    FINNIFTY: "NIFTY FIN SERVICE"
    MIDCPNIFTY: "NIFTY MID SELECT"
  candle_intervals:
    1m:
      kite_interval: minute
    15m:
      kite_interval: 15minute
    60m:
      kite_interval: 60minute
    day:
      kite_interval: day

research:
  enforce_feature_availability: false
  enforce_regime_policy: false
  enforce_strategy_eligibility: true
  min_history_observations: 1

backtest_readiness:
    min_complete_days: 20
    min_iv_rv_aligned_days: 10
    min_regime_days: 10

strategies:
  iron_condor_monitor:
    enabled: true
    strategy_type: iron_condor
    underlyings:
      - NIFTY
    wing_distance_points: 200
    min_credit: 20
    min_days_to_expiry: 1
    min_iv_rank: 30

    regime_policy:
      allowed_regimes:
        - BEAR|HIGH
        - HIGH_IV_CONTANGO_NORMAL_SKEW
        - HIGH_IV_FLAT_TERM_NORMAL_SKEW
        - NORMAL_IV_CONTANGO_NORMAL_SKEW
        - NORMAL_IV_FLAT_TERM_NORMAL_SKEW
      blocked_regimes:
        - HIGH_IV_BACKWARDATION_HIGH_PUT_SKEW
      require_iv_rank_available: true

    risk:
      max_lots_per_order: 2
      max_open_positions: 1
      max_daily_loss: 25000
      max_notional_exposure: 2000000
      max_spread_pct: 0.06

    exits:
      profit_target_pct: 50
      stop_loss_credit_multiple: 2.0
      theta_decay_target_pct: 50
      iv_collapse_pct: 20
      data_quality_max_age_seconds: 30
      expected_move_violation_buffer: 1.25

evidence:
  enabled: true
  plugins:
    multi_timeframe:
      enabled: true
      timeframes: [1m, 15m, 60m]
      history_limit: 6000
